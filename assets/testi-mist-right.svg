<svg width="722" height="742" viewBox="-100 0 722 742" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Exported from Figma: right swirl (Vector 263), cropped to the frame on the right and bottom.
     It billows slowly, anchored at its lower-right; the canvas extends 100px left of the swirl
     so its tip has room to swell. -->
<style>
.billow {
  transform-box: fill-box;
  transform-origin: 100% 100%;
  animation: billow 10s ease-in-out -4s infinite alternate;
}
@keyframes billow {
  0% { opacity: 1; transform: translate(0, 0) scale(1, 1) skewY(0deg); }
  50% { opacity: 0.85; transform: translate(-8px, -6px) scale(1.03, 1.04) skewY(-1deg); }
  100% { opacity: 1; transform: translate(4px, -10px) scale(1.015, 1.06) skewY(0.8deg); }
}
@media (prefers-reduced-motion: reduce) {
  .billow { animation: none; }
}
</style>
<defs>
<linearGradient id="mist-r" x1="428.989" y1="33.4844" x2="-0.495313" y2="457.229" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFE3B2" stop-opacity="0.9"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</linearGradient>
</defs>
