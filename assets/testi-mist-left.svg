<svg width="760" height="982" viewBox="0 0 760 982" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Exported from Figma: upper-left swirl (Vector 264) and lower-left swirl (Vector 265, at y 748).
     Each swirl billows slowly, anchored at the edge it grows out of; the canvas is wider than
     the swirls so their tips have room to swell. -->
<style>
.billow {
  transform-box: fill-box;
  animation: billow ease-in-out infinite alternate;
}
.billow--top {
  transform-origin: 0% 0%;
  animation-duration: 9s;
}
.billow--bottom {
  transform-origin: 0% 100%;
  animation-duration: 7s;
  animation-delay: -3s;
}
@keyframes billow {
  0% { opacity: 1; transform: translate(0, 0) scale(1, 1) skewX(0deg); }
  50% { opacity: 0.85; transform: translate(10px, 4px) scale(1.04, 1.025) skewX(1.5deg); }
  100% { opacity: 1; transform: translate(-6px, 8px) scale(1.06, 1.01) skewX(-1deg); }
}
@media (prefers-reduced-motion: reduce) {
  .billow { animation: none; }
}
</style>
<defs>
<linearGradient id="mist-tl" x1="49.6432" y1="-134.426" x2="840.375" y2="201.953" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFE3B2" stop-opacity="0.9"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</linearGradient>
<linearGradient id="mist-bl" x1="49.1047" y1="389.151" x2="681.537" y2="102.149" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFE3B2" stop-opacity="0.9"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</linearGradient>
</defs>
