<svg width="510" height="842" viewBox="-100 0 510 842" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Medium layout. Exported from Figma (MD): right swirl (Vector 263), cropped to the frame on
     the right. Billows like testi-mist-right.svg; the canvas extends 100px left of the swirl
     so its tip has room to swell. -->
<style>
.billow {
  transform-box: fill-box;
  transform-origin: 100% 100%;
  animation: billow 10s ease-in-out -4s infinite alternate;
}
@keyframes billow {
  0% { opacity: 1; transform: translate(0, 0) scale(1, 1) skewY(0deg); }
  50% { opacity: 0.85; transform: translate(-8px, -6px) scale(1.03, 1.04) skewY(-1deg); }
  100% { opacity: 1; transform: translate(4px, -10px) scale(1.015, 1.06) skewY(0.8deg); }
}
@media (prefers-reduced-motion: reduce) {
  .billow { animation: none; }
}
</style>
<defs>
<linearGradient id="mist-r" x1="489.568" y1="-10.0279" x2="5.39622" y2="349.963" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFE3B2" stop-opacity="0.9"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</linearGradient>
</defs>
