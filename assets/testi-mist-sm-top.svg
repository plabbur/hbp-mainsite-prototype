<svg width="402" height="260" viewBox="0 0 402 260" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Small layout. Exported from Figma (SM): the upper swirl (Vector 265). Billows like
     testi-mist-left.svg. -->
<style>
.billow {
  transform-box: fill-box;
  transform-origin: 0% 0%;
  animation: billow 9s ease-in-out infinite alternate;
}
@keyframes billow {
  0% { opacity: 1; transform: translate(0, 0) scale(1, 1) skewX(0deg); }
  50% { opacity: 0.85; transform: translate(8px, 3px) scale(1.04, 1.025) skewX(1.5deg); }
  100% { opacity: 1; transform: translate(-5px, 6px) scale(1.06, 1.01) skewX(-1deg); }
}
@media (prefers-reduced-motion: reduce) {
  .billow { animation: none; }
}
</style>
<defs>
<linearGradient id="mist-sm-top" x1="-172" y1="76" x2="512.88" y2="93.20" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFE3B2" stop-opacity="0.9"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</linearGradient>
</defs>
