<svg width="389" height="530" viewBox="0 0 389 530" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Small layout. Exported from Figma (SM): the lower-right swirl (Vector 266). Billows like
     testi-mist-right.svg. -->
<style>
.billow {
  transform-box: fill-box;
  transform-origin: 100% 100%;
  animation: billow 8s ease-in-out infinite alternate;
  animation-delay: -2s;
}
@keyframes billow {
  0% { opacity: 1; transform: translate(0, 0) scale(1, 1) skewX(0deg); }
  50% { opacity: 0.85; transform: translate(-8px, -4px) scale(1.04, 1.025) skewX(-1.5deg); }
  100% { opacity: 1; transform: translate(5px, -6px) scale(1.06, 1.01) skewX(1deg); }
}
@media (prefers-reduced-motion: reduce) {
  .billow { animation: none; }
}
</style>
