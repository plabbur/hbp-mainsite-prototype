<svg width="1000" height="982" viewBox="0 0 1000 982" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Medium layout. Sparkles from the Figma "Stars" group, redrawn as vectors (the originals are raster masks).
     Each one twinkles on its own period and phase. -->
<style>
.tw {
  transform-box: fill-box;
  transform-origin: center;
  animation-name: twinkle;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
  50% { opacity: 0.3; transform: scale(0.55) rotate(25deg); }
}
@media (prefers-reduced-motion: reduce) {
  .tw { animation: none; }
}
</style>
<defs>
<path id="sparkle" d="M0 -0.5C0.07 -0.07 0.07 -0.07 0.5 0C0.07 0.07 0.07 0.07 0 0.5C-0.07 0.07 -0.07 0.07 -0.5 0C-0.07 -0.07 -0.07 -0.07 0 -0.5Z"/>
<filter id="sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g fill="#FFD391" filter="url(#sparkle-glow)">
<g class="tw" style="animation-duration:2.6s;animation-delay:-0.0s"><use href="#sparkle" transform="translate(190 204) scale(16)"/></g>
<g class="tw" style="animation-duration:3.4s;animation-delay:-1.3s"><use href="#sparkle" transform="translate(200 229) scale(10)"/></g>
<g class="tw" style="animation-duration:2.9s;animation-delay:-2.1s"><use href="#sparkle" transform="translate(170 201) scale(10)"/></g>
<g class="tw" style="animation-duration:3.8s;animation-delay:-0.7s"><use href="#sparkle" transform="translate(185 177) scale(10)"/></g>
<g class="tw" style="animation-duration:3.1s;animation-delay:-1.8s"><use href="#sparkle" transform="translate(867 156) scale(16)"/></g>
<g class="tw" style="animation-duration:2.4s;animation-delay:-0.4s"><use href="#sparkle" transform="translate(857 181) scale(10)"/></g>
<g class="tw" style="animation-duration:4.2s;animation-delay:-2.6s"><use href="#sparkle" transform="translate(758 251) scale(35)"/></g>
<g class="tw" style="animation-duration:3.6s;animation-delay:-1.1s"><use href="#sparkle" transform="translate(172 766) scale(27)"/></g>
<g class="tw" style="animation-duration:3.0s;animation-delay:-3.2s"><use href="#sparkle" transform="translate(826 817) scale(29)"/></g>
<g class="tw" style="animation-duration:4.0s;animation-delay:-0.9s"><use href="#sparkle" transform="translate(174 566) scale(32)"/></g>
<g class="tw" style="animation-duration:2.7s;animation-delay:-2.3s"><use href="#sparkle" transform="translate(241 590) scale(13)"/></g>
<g class="tw" style="animation-duration:3.3s;animation-delay:-1.6s"><use href="#sparkle" transform="translate(193 533) scale(13)"/></g>
<g class="tw" style="animation-duration:3.9s;animation-delay:-2.9s"><use href="#sparkle" transform="translate(844 775) scale(23)"/></g>
</g>
</svg>
